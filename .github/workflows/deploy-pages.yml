name: Publicar app 27

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar solo los archivos públicos de la app
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R src icons _site/
      - name: Crear el paquete del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar por HTTPS
        id: deployment
        uses: actions/deploy-pages@v4
